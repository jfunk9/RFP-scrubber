name: Run RFP Scraper

on:
  # Manual trigger — the "Refresh" button
  workflow_dispatch:

  # Auto-run every weekday at 7:00 AM Central (12:00 UTC)
  schedule:
    - cron: '0 12 * * 1-5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: |
          # Override the output paths for GitHub Actions environment
          python -c "
          import mn_bid_scraper as s
          import os

          # Override paths so output goes to repo root
          s.GITHUB_REPO_DIR = os.getcwd()
          s.OUTPUT_FILE = os.path.join(os.getcwd(), 'mn_bids_report.txt')
          s.run()
          "

      - name: Commit and push updated dashboard
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html mn_bids_report.txt
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(date +'%Y-%m-%d %H:%M UTC')"
          git push
