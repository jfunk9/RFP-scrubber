name: Run RFP Scraper

on:
  # Manual trigger — the "Refresh" button
  workflow_dispatch:

  # Auto-run on pushes that change scraper code/deps/workflow
  push:
    branches: [main]
    paths:
      - 'mn_bid_scraper.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

  # Auto-run every weekday at 7:00 AM Central (12:00 UTC)
  schedule:
    - cron: '0 12 * * 1-5'

# Artifact-based GitHub Pages deploy — CI never commits to main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run scraper
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: |
          python -c "
          import mn_bid_scraper as s
          import os
          # Output goes to repo root so it lands in the Pages artifact
          s.GITHUB_REPO_DIR = os.getcwd()
          s.OUTPUT_FILE = os.path.join(os.getcwd(), 'mn_bids_report.txt')
          s.run()
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
